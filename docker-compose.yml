version: '3.8'

services:
  yt-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-downloader-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - downloads_data:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  downloads_data:
